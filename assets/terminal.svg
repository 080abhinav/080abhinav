<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Fira+Code:wght@400;600&amp;display=swap');
      .terminal-text {
        font-family: 'Share Tech Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
        font-size: 13.5px;
        fill: #e6edf3;
      }
      .prompt { fill: #38bdf8; font-weight: bold; }
      .cmd { fill: #f0f6fc; }
      .key { fill: #79c0ff; }
      .str { fill: #7ee787; }
      .punct { fill: #8b949e; }
      .cursor {
        fill: #22c55e;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Shadow & Background -->
  <rect x="5" y="5" width="710" height="270" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Header Bar -->
  <path d="M 5 15 Q 5 5 15 5 L 705 5 Q 715 5 715 15 L 715 38 L 5 38 Z" fill="#161b22" />
  <line x1="5" y1="38" x2="715" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="25" cy="21" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="43" cy="21" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="61" cy="21" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="360" y="25" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">080abhinav@devbox:~</text>

  <!-- Terminal Content -->
  <text class="terminal-text" x="25" y="65">
    <tspan class="prompt">080abhinav@devbox</tspan><tspan class="punct">:</tspan><tspan class="str">~</tspan><tspan class="punct">$ </tspan><tspan class="cmd">cat profile.json</tspan>
  </text>

  <text class="terminal-text" x="25" y="90"><tspan class="punct">{</tspan></text>
  
  <text class="terminal-text" x="45" y="115">
    <tspan class="key">"name"</tspan><tspan class="punct">: </tspan><tspan class="str">"Abhinav"</tspan><tspan class="punct">,</tspan>
  </text>

  <text class="terminal-text" x="45" y="140">
    <tspan class="key">"learning"</tspan><tspan class="punct">: [</tspan><tspan class="str">"DSA with Java"</tspan><tspan class="punct">, </tspan><tspan class="str">"AI Agents"</tspan><tspan class="punct">, </tspan><tspan class="str">"LangGraph"</tspan><tspan class="punct">, </tspan><tspan class="str">"MCP"</tspan><tspan class="punct">, </tspan><tspan class="str">"System Design"</tspan><tspan class="punct">],</tspan>
  </text>

  <text class="terminal-text" x="45" y="165">
    <tspan class="key">"building"</tspan><tspan class="punct">: [</tspan><tspan class="str">"Agentic Workflows"</tspan><tspan class="punct">, </tspan><tspan class="str">"Modern Full-Stack Apps"</tspan><tspan class="punct">],</tspan>
  </text>

  <text class="terminal-text" x="45" y="190">
    <tspan class="key">"fun_fact"</tspan><tspan class="punct">: </tspan><tspan class="str">"Turn every quirky idea into a working prototype ⚡"</tspan>
  </text>

  <text class="terminal-text" x="25" y="215"><tspan class="punct">}</tspan></text>

  <text class="terminal-text" x="25" y="245">
    <tspan class="prompt">080abhinav@devbox</tspan><tspan class="punct">:</tspan><tspan class="str">~</tspan><tspan class="punct">$ </tspan><tspan class="cursor">▋</tspan>
  </text>
</svg>
